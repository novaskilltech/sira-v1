name: Sira validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Assert public release is refused for DEMO
        run: |
          if npm run validate:public; then
            echo "Unexpected public approval of DEMO corpus"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: reports/
